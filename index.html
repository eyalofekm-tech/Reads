    title: `The world you see is a forecast`,
    body: `Most of what you're seeing right now isn't coming from your eyes. It's coming from a prediction your brain made a fraction of a second ago, based on everything that's happened so far — and your eyes are mostly just checking the prediction for errors.

This is how vision actually works, more or less. Light hits your retina and travels to your visual cortex a little too slowly to explain how fast you react to things. So your brain runs ahead of the data: it guesses what the next instant will look like, and shows you the guess. When the guess matches reality, which is most of the time, you never notice the trick. You just feel like you're watching things happen live.

You can catch the seams if you know where to look. That's why a magic trick works even when you're staring right at the sleight of hand — your brain fills in the "obvious" continuation instead of tracking every frame. It's why a jump scare in a familiar hallway lands harder than one in a strange room — your prediction was so confident that the error registers as a jolt. It's why time seems to skip or stutter during a car accident or a fall: the model breaks completely, and your brain has nothing pre-rendered to show you, so consciousness has to catch up in real time for once.

There's something almost tender about this once you sit with it. Your brain isn't lazily faking reality to save effort — it's making its best offer, constantly, based on a lifetime of pattern. What you call "the present" is really a running best-guess, revised many times a second, mostly right, occasionally caught out. You've never once seen the world exactly as it is. You've only ever seen what your own history expected to find there.`

  {
    title: `Why the world looks dimmer after you make something`,
    body: `There's a specific flatness that shows up after you finish something you were really absorbed in — a story, a song, a long stretch of building or drawing or planning a world in your head. Not sadness exactly. More like someone turned the saturation down on ordinary life. Colors look a little duller. Conversations feel a little further away. Nothing's wrong, but nothing quite lands either.

It has a mundane explanation, which somehow makes it more comforting rather than less. While you're deep in a creative stretch, your attention is running at a much higher resolution than usual — tracking tone, rhythm, texture, causality, dozens of small decisions a minute, for hours or days. Your brain calibrates to that intensity as the new normal. Then the project ends, or you put it down, and regular life — which was always this quiet — suddenly reads as suspiciously quiet by comparison. It's not that the color drained out of the world. It's that you'd turned your own brightness all the way up, and now you're standing in the same room you always stood in, just without the extra wattage you got used to supplying yourself.

People who make things for a living have private names for this and rarely say them out loud, because "reality feels less real after I finish a project" sounds like something to worry about rather than something ordinary. It isn't dissociation, and it isn't a warning sign. It's closer to what athletes feel after a big event, or what actors describe after closing night — a comedown from self-generated intensity, not a symptom of anything.

It also passes on its own, usually within a few days, once your baseline recalibrates back down to meet you. The trick, if there is one, is not to mistake the quiet for something being wrong with you. You didn't lose the color. You came down from a height you built yourself, and normal ground always feels strange for a minute before it feels like ground again.`

This is called reconsolidation, and it explains a few things that used to seem strange. Why two siblings can have flatly contradicting memories of the same childhood afternoon, both telling the truth as they experience it. Why a memory of an ex can drift from painful to almost fond, or the reverse, with no new events involved — you've just kept re-remembering it through different emotional weather. Why some therapists ask people to recall a difficult memory from a calm, safe state on purpose: not to erase it, but to give it a gentler edit on its way back into storage.

The slightly unsettling way to put this: the memory of your first bike ride, or your wedding day, or your worst fight, is not the original file. It's closer to the fortieth photocopy of a photocopy, softened and lightly redrawn each time, shaped a little by whoever you were on the day you last thought about it.

The comforting way to put the same fact: nothing painful is sealed in amber forever just because it happened. Recalling an old hurt from a calmer, more resourced place isn't just processing it — it's a chance to hand it back to storage slightly kinder than you found it. You've been quietly rewriting yourself this whole time. You may as well do it on purpose sometimes.`

  {
    title: `Why unfinished things are louder than finished ones`,
    body: `In the 1920s, a psychologist named Bluma Zeigarnik noticed something odd about waiters: they could hold an entire complicated order in their head perfectly, right up until they delivered it. The moment the plates hit the table, the order vanished from memory almost completely, as if it had never been there.

The general version of this is called the Zeigarnik effect: unfinished tasks occupy far more mental space than completed ones, even after you've stopped actively working on them. Your mind doesn't file a task away once you've decided to do it — it files it away once it's actually done. Until then, it keeps a low hum of tension running in the background, quietly asking to be checked on.

This is why a half-written email can bother you more than a finished one you haven't sent, why a load of laundry left in the washer nags at you more than laundry not yet started, and why lying in bed running through tomorrow's undone tasks feels different from running through today's completed ones — one is a live wire, the other is inert.

There's a genuinely useful trick hidden in this. You don't have to finish a task to quiet the hum — you often just have to make a concrete plan for when and how you'll finish it. Writing down "I'll reply to this at 9am tomorrow" resolves a surprising amount of the tension, because your brain isn't actually asking you to do the thing right now. It's asking to be told the thing has somewhere to land. Once it has an appointment, it can stop tugging at your sleeve.

Most mental clutter isn't procrastination. It's a long list of open loops that were never given a landing time.`

  {
    title: `You love it more because your hands were on it`,
    body: `In a study that later gave its name to a whole psychological effect, researchers had people build simple flat-pack furniture — boxes, storage bins — and then asked them to bid on what they'd built, alongside identical pre-built versions. People consistently valued the one they'd assembled themselves more, sometimes dramatically more, even though it was, by any objective measure, the exact same object.

This is the IKEA effect, and it isn't really about furniture. It shows up anywhere effort gets folded into something you end up owning. A garden you planted from seed matters more to you than an identical one you inherited already grown. A recipe you fumbled your way through and eventually got right tastes better to you than the same dish ordered at a restaurant, even when the restaurant's is objectively better cooked. A presentation you built from a blank page feels more "yours" than one you inherited and lightly edited, even if the edited one is stronger.

The mechanism seems to be that effort gets read by your brain as a signal of value, almost regardless of the outcome. You don't love the shelf because it's well made. You love it because some part of you registers the hours of mild frustration and squinting at diagrams as proof that this thing matters, and that proof doesn't erase itself just because the shelf turned out slightly crooked.

It cuts a useful way for anyone building a habit, a relationship, or a piece of work: the version you struggle through and half mess up will often mean more to you than the version handed to you clean. Not despite the friction. Because of it. Your attachment to things is, in part, a receipt for the effort you spent on them.`

    title: `You think you're the finished draft`,

Psychologists call this the end-of-history illusion, and it shows up at every age they've tested. People are perfectly willing to admit they used to be a different person. They're strangely unwilling to believe they're still becoming one. Your past self feels like a rough draft. Your present self feels like the final version, mailed off, no further edits expected.

It's an easy illusion to catch yourself in if you look for it. The values you're sure you'll hold forever, the relationships you're sure won't change shape, the tastes you assume are simply "you" now — a decade of actual data says a meaningful chunk of that will look different later, the same way the version of you from a decade ago barely resembles the one reading this. You weren't wrong then. You'll be more finished later than you are right now, and less finished than you'll be after that.

The useful move isn't to distrust your current self — it's to hold your current preferences a little more loosely than they feel. The career you're sure is permanent, the opinion you're sure will never budge: treat them as your best current draft, not the printed final copy. History isn't over. It just always feels that way from wherever you happen to be standing in it.`

    title: `You like it because you've seen it before`,
    body: `In one of the more quietly unsettling findings in psychology, people who are shown random characters they can't read, over and over, for fractions of a second each, will later rate the ones they saw more often as more likeable than the ones they saw less often — with no idea why. They don't remember seeing them. They just prefer them.

This is the mere-exposure effect: familiarity itself generates warmth, independent of merit, independent of even conscious memory of the exposure. It's a big part of why the song you hated the first three times on the radio becomes the song you can't skip by the tenth. Why the coworker who annoyed you in week one becomes one of your favorite people by month six, without either of you really changing. Why brands spend money on ads that don't even try to persuade you of anything — just to put the logo in front of your eyes again, because repetition alone does most of the persuading.

There's a slightly uncomfortable implication buried in this: a decent amount of what you experience as "this feels right to me" is actually "this is familiar to me," and your brain doesn't always bother distinguishing the two. The opinions you hold most comfortably, the foods you call your favorites, the people you trust fastest — some real fraction of that is taste, and some real fraction is repetition wearing taste's clothing.

It also cuts the other way, usefully. If something new feels off-putting on first contact — a piece of music, a food, a person — that reaction alone tells you almost nothing about whether you'll like it later. Sometimes disliking something is just what liking it looks like, before you've seen it enough times.`
  },

    title: `Nobody is watching you as closely as you think`,
    body: `In a well-known experiment, students were asked to walk into a room full of strangers wearing an embarrassing T-shirt — a picture of a musician most people would find cringeworthy. Beforehand, they guessed that about half the room would notice and remember the shirt. Afterward, when the room was actually asked, fewer than a quarter had registered it at all.

This gap has a name: the spotlight effect. You experience yourself as the main character of every room you walk into, so it feels obvious that other people are tracking your stumble, your outfit, your voice cracking, your typo in the group email. Meanwhile, everyone else in that room is starring in their own production, running the exact same spotlight over themselves, with correspondingly little processing power left over for you.

This is easy to know intellectually and still hard to believe emotionally, because the feeling of being watched is so vivid from the inside. But it's worth sitting with the asymmetry: you remember your own awkward moment from three years ago in specific, wincing detail. Can you remember a single awkward moment a stranger had in front of you three years ago? Probably not, unless it was truly extreme — and if you can't, it's a safe bet nobody's holding onto yours either.

None of this means nobody ever judges you. It means the volume of judgment you imagine pointed at you is almost always turned up far past what's actually happening, because you're the only one in the room who has to live inside your own reaction. Other people are too busy managing their own spotlight to run yours for very long.`

This is the curse of knowledge, and it explains a lot of bad instructions, confusing textbooks, and frustrating conversations with experts. The person who wrote the manual knows the system so well that they can no longer model a mind that doesn't know it. They're not withholding information on purpose. They've genuinely lost access to their own beginner self.

It shows up in smaller ways constantly. You explain a joke's context to a friend without realizing you left out the one detail that makes it land. You give directions using a landmark that only makes sense if you already know the neighborhood. A parent forgets how genuinely hard tying shoelaces once was, and gets baffled by a five-year-old's tears over it.

The uncomfortable part is that this curse is basically permanent for any given piece of knowledge — you can't deliberately unlearn something to remember what confusion about it felt like. But you can build a habit around it: whenever you're explaining something you know well, assume you've forgotten at least one step, and ask what a total stranger to this topic would need first. You'll never fully get back the eyes of your beginner self. You can at least go looking for someone else's.`

    title: `Your beliefs are often just explanations for what you already did`,
    body: `The usual assumption is that beliefs come first and actions follow: you believe something, so you act on it. A lot of the evidence points the other way. People routinely act first, for reasons that have nothing to do with conviction — convenience, social pressure, a decision made in a hurry — and then quietly build a belief that makes the action make sense, so they don't have to sit with having done something they can't explain to themselves.

This is cognitive dissonance reduction, and one of the classic demonstrations of it is almost comically simple: pay one group of people a lot of money to say a boring task was interesting, and pay another group very little to say the same thing. The group paid less ends up actually rating the task as more interesting afterward. They had a big justification, money, for the first group's lie, and barely any for their own, so their brain manufactured a genuine belief instead — "I said it was interesting because it actually was," rather than "I said it because I was told to."

This is happening quietly all the time. People come to genuinely love jobs they only took because nothing else was available. People convince themselves a purchase was wise mainly because they already made it. A position, once acted on publicly, tends to harden — not because new evidence arrived, but because reversing course would mean admitting the earlier action was a mistake, and that's heavier to carry than a slightly adjusted belief.

It's worth occasionally asking, about a belief you hold strongly: did I arrive here by evidence, or did I act first and build the belief afterward to keep the story straight? Not every strongly held view is a rationalization. But some of the ones that feel most unshakeable got that way for exactly this reason.`

    title: `You always think this time will be different`,
    body: `Ask someone how long a task will take, and they'll usually answer as though everything is going to go right — no interruptions, no unexpected complications, no ordinary friction. This happens even when the same person has a long personal history of tasks taking longer than planned. Past evidence barely makes a dent in the next estimate.

This is the planning fallacy, and the strange part isn't that people are bad at estimating — it's that people are consistently optimistic in the same direction, over and over, no matter how much contrary evidence they've personally accumulated. Ask a student how long a thesis chapter will take and they'll give a number based on a version of events where they don't get distracted, don't get sick, don't hit a section that turns out harder than expected. Then ask how long the last chapter actually took. The numbers rarely match, and the next estimate rarely learns from the gap.

Part of the reason is that when you imagine the future task, you imagine the plan, not the friction. Friction is invisible until you're inside it. When you picture writing the report, you picture writing it smoothly — you don't spontaneously picture the meeting that runs long, because that wasn't part of the plan you were picturing.

One of the few things that reliably helps is switching the question. Instead of asking "how long will this take me," ask "how long did the last three similar things actually take," and use that number instead of a fresh guess. It feels pessimistic. It's usually just accurate. The plan in your head was never wrong about the task — it was just missing everything that wasn't the task.`

This is loss aversion, and it quietly runs more of your daily decisions than it gets credit for. It's why the fear of losing what you have will usually beat the appeal of gaining something new of equal value — which is why people stay in mediocre jobs and mediocre routines long after a genuinely better option is sitting in plain view, not because they can't see it, but because the imagined loss of the current thing outweighs the imagined gain of the new one, even when a spreadsheet would say the new one is clearly ahead.

It also explains a strange pattern in how people take risks. Someone who is up money at a poker table tends to play looser, because they're now gambling with "house money," a gain that doesn't feel as real as a loss would. Someone who is down money at the same table tends to take wildly bigger risks trying to get back to even, because the pain of the loss they're already sitting in outweighs any rational read of the odds.

None of this means your losses aren't real. It means the feeling is calibrated to be louder than the facts warrant, by a factor of about two, every time. Worth remembering the next time a decision feels obviously risky purely because it involves giving something up — the math is quieter than the feeling.`

    title: `More options can make you less happy with your choice`,
    body: `In a well-known field experiment, a grocery store set up a tasting table with jam — sometimes offering 6 flavors, sometimes offering 24. The bigger display drew more browsers, as you'd expect. But the smaller display sold far more jam. People facing 24 choices bought less, and reported feeling less satisfied with what they did buy, than people facing 6.

This is the paradox of choice: past a certain point, more options don't make you happier, they make deciding harder and your eventual choice feel worse, because every option you didn't pick becomes a small, specific regret instead of an abstraction. With 6 flavors, the ones you skipped are a vague blur. With 24, you remember exactly which one you passed over, and some part of you keeps quietly wondering about it.

This helps explain temporal discounting: the well-documented tendency to consistently favor a smaller reward now over a larger reward later, even when the later reward is objectively much better on paper. It's not just impatience. It's that the "you" who will enjoy the retirement savings, or wake up well-rested because you went to bed on time, doesn't feel fully like you yet. You're not stealing from your future self so much as failing to recognize them as someone worth protecting.

// ---------------------------------------------------------------
// App logic
// ---------------------------------------------------------------
const START_KEY = 'marginalia_start_date';
const READ_KEY = 'marginalia_read_indices';

function utcDays(y, m, d) {
  return Date.UTC(y, m, d) / 86400000;
}

function todayParts() {
  const now = new Date();
  return [now.getFullYear(), now.getMonth(), now.getDate()];
}

function getStartDate() {
  let stored = localStorage.getItem(START_KEY);
  if (!stored) {
    const [y, m, d] = todayParts();
    stored = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    localStorage.setItem(START_KEY, stored);
  }
  return stored; // 'YYYY-MM-DD'
}

function parseISODate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return [y, m - 1, d];
}

function daysSinceStart() {
  const start = parseISODate(getStartDate());
  const today = todayParts();
  const diff = utcDays(...today) - utcDays(...start);
  return Math.max(0, Math.floor(diff));
}

function getReadSet() {
  try {
    return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}

function markRead(index) {
  const s = getReadSet();
  s.add(index);
  localStorage.setItem(READ_KEY, JSON.stringify([...s]));
}

function readingMinutes(text) {
  const words = text.trim().split(/\s+/).length;
  return Math.max(1, Math.round(words / 200));
}

function formatDate(iso) {
  const [y, m, d] = parseISODate(iso);
  return new Date(y, m, d).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

let viewingIndex = null; // null = show default ("today" or caught-up message)

function renderProse(body) {
  return body.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
}

function heroIndexFor(currentIndex, caughtUp) {
  if (viewingIndex !== null) return viewingIndex;
  return caughtUp ? null : currentIndex;
}

function renderHero(currentIndex, caughtUp) {
  const hero = document.getElementById('hero');
  const backLink = document.getElementById('back-link');
  const showIndex = heroIndexFor(currentIndex, caughtUp);

  if (showIndex === null) {
    hero.innerHTML = `
      <div class="caught-up">
        <h1>You're all caught up</h1>
        <p>That's every read available so far. The next one arrives tomorrow — or reread anything below in the meantime.</p>
      </div>`;
    backLink.classList.remove('visible');
    return;
  }

  const read = READS[showIndex];
  hero.innerHTML = `
    <h1 class="title">${read.title}</h1>
    <div class="meta">${readingMinutes(read.body)} min read</div>
    <div class="prose">${renderProse(read.body)}</div>
  `;
  markRead(showIndex);
  backLink.classList.toggle('visible', viewingIndex !== null);
}

function renderArchive(currentIndex, caughtUp) {
  const list = document.getElementById('archive-list');
  const empty = document.getElementById('archive-empty');
  list.innerHTML = '';

  const upperBound = caughtUp ? READS.length - 1 : currentIndex;
  const skipIndex = heroIndexFor(currentIndex, caughtUp);

  const indices = [];
  for (let i = upperBound; i >= 0; i--) {
    if (i === skipIndex) continue;
    indices.push(i);
  }

  if (indices.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const readSet = getReadSet();
  indices.forEach(i => {
    const li = document.createElement('li');
    const isRead = readSet.has(i);
    li.innerHTML = `
      <button class="archive-row" data-index="${i}">
        <span class="dot ${isRead ? 'read' : 'unread'}"></span>
        <span class="archive-day">Day ${i + 1}</span>
        <span class="archive-title">${READS[i].title}</span>
      </button>`;
    list.appendChild(li);
  });

  list.querySelectorAll('.archive-row').forEach(btn => {
    btn.addEventListener('click', () => {
      viewingIndex = parseInt(btn.dataset.index, 10);
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderFooter() {
  const start = getStartDate();
  const footer = document.getElementById('footer');
  footer.innerHTML = `Started ${formatDate(start)}. <button id="change-start">Change</button>`;
  document.getElementById('change-start').addEventListener('click', () => {
    const input = prompt('Set the start date (YYYY-MM-DD). Day 1 will fall on this date:', getStartDate());
    if (!input) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(input)) {
      alert('Please use the format YYYY-MM-DD, for example 2026-09-17.');
      return;
    }
    localStorage.setItem(START_KEY, input);
    viewingIndex = null;
    renderAll();
  });
}

function renderAll() {
  const elapsed = daysSinceStart();
  const currentIndex = Math.min(elapsed, READS.length - 1);
  const caughtUp = elapsed >= READS.length;
  document.getElementById('day-count').textContent = `Day ${elapsed + 1}`;
  renderHero(currentIndex, caughtUp);
  renderArchive(currentIndex, caughtUp);
  renderFooter();
}

document.getElementById('back-link').addEventListener('click', () => {
  viewingIndex = null;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderAll();
</script>
